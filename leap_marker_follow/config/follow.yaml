marker_follow:
  ros__parameters:
    marker_id: 0
    reference_file: '~/.ros/leap_marker_follow/reference.json'
    # First manual vehicle acceptance: 2026-10-22, nominal front gap 25cm.
    max_forward_mps: 0.10
    max_turn_rps: 0.60
    forward_gain: 0.50
    turn_gain: 1.20
    target_timeout: 0.25
    input_timeout: 0.40
    front_margin_m: 0.18
    side_margin_m: 0.04
